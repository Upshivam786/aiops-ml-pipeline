groups:
  - name: ml-api
    rules:
      - alert: ApiDown
        expr: up{job="ml-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "ML API is not responding to Prometheus scrapes"
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status="5xx"}[1m])) / sum(rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate above 5%"
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{handler="/predict"}[1m])) by (le)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 /predict latency above 500 ms"
